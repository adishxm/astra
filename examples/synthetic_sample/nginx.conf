# Nginx TLS & Cipher Configuration (Synthetic Sample)
events {
    worker_connections 1024;
}

http {
    server {
        listen 443 ssl;
        server_name api.hexark.internal;

        ssl_certificate /etc/ssl/certs/sample_certificate.pem;
        ssl_certificate_key /etc/ssl/private/sample_key.pem;

        # TLS Protocols & Cipher Suites
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://backend:8000;
        }
    }
}
